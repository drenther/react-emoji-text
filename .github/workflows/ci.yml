name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 11.0.7

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.15.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run lint
      - run: pnpm run format:check
      - run: pnpm run typecheck
      - run: pnpm run test
      - run: pnpm run test:coverage
      - run: pnpm run build

      - name: Post coverage comment
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          COMMENT_MARKER="<!-- react-emoji-text-coverage -->"
          BODY="$COMMENT_MARKER
          ## Coverage Report

          | Package | Statements | Branches | Functions | Lines |
          |---------|------------|----------|-----------|-------|"

          for pkg in packages/react-emoji-text; do
            SUMMARY="$pkg/coverage/coverage-summary.json"
            if [ ! -f "$SUMMARY" ]; then
              continue
            fi

            METRICS=$(jq -r '.total | "\(.statements.pct)% | \(.branches.pct)% | \(.functions.pct)% | \(.lines.pct)%"' "$SUMMARY")
            PKG_NAME=$(jq -r '.name' "$pkg/package.json")
            BODY="$BODY
          | \`$PKG_NAME\` | $METRICS |"
          done

          BODY="$BODY

          *Updated by CI - $(date -u '+%Y-%m-%d %H:%M UTC')*"

          EXISTING=$(gh api "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" \
            --jq "map(select(.body | startswith(\"$COMMENT_MARKER\"))) | .[0].id // empty")

          if [ -n "$EXISTING" ]; then
            gh api "repos/${{ github.repository }}/issues/comments/${EXISTING}" \
              -X PATCH -f body="$BODY"
          else
            gh api "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" \
              -X POST -f body="$BODY"
          fi
